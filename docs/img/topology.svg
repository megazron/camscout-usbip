<text x="24" y="268" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">The five silent failures</text>
<circle cx="34" cy="288" r="10" fill="#b91c1c"/>
<text x="34" y="292" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">1</text>
<text x="54" y="292" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">stale /dev/shm segments</text>
<text x="54" y="307" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">publisher decodes, subscriber gets nothing   ·   see ddsdetective-ros2</text>
<circle cx="34" cy="332" r="10" fill="#b91c1c"/>
<text x="34" y="336" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">2</text>
<text x="54" y="336" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">QoS mismatch</text>
<text x="54" y="351" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">RELIABLE subscriber vs BEST_EFFORT publisher   ·   ros2 topic hz also gets zero</text>
<circle cx="34" cy="376" r="10" fill="#b91c1c"/>
<text x="34" y="380" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">3</text>
<text x="54" y="380" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">two openers of one device</text>
<text x="54" y="395" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">first to start wins, the other reads nothing   ·   camera-doctor who /dev/videoN</text>
<circle cx="34" cy="420" r="10" fill="#b91c1c"/>
<text x="34" y="424" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">4</text>
<text x="54" y="424" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">wedged RTSP vision module</text>
<text x="54" y="439" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">ping and HTTP 200 still pass   ·   camera-doctor rtsp IP</text>
<circle cx="34" cy="464" r="10" fill="#b91c1c"/>
<text x="34" y="468" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">5</text>
<text x="54" y="468" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">a probe that lies</text>
<text x="54" y="483" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">gst rtspsrc ! fakesink can never link   ·   prove a probe on a known-good device</text>
<text x="700" y="300" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">The wrist cameras are not USB at all</text>
