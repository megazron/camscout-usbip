<text x="814.0" y="182" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">MJPG 640x480</text>
<text x="814.0" y="195" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">read, do not just open</text>
