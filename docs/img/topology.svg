<text x="24" y="34" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Where a camera frame travels, and the five places it silently stops</text>
<text x="24" y="54" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Every one of these presents the same way: a node at 20-30% CPU, Publisher count 1, and a blank panel.</text>
