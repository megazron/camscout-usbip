<text x="895" y="338" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">TCP</text>
<rect x="940" y="314" width="170" height="62" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="1025" y="338" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">kinova_vision node</text>
<text x="1025" y="356" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">retries for ever if wedged</text>
<circle cx="895" cy="366" r="10" fill="#b91c1c"/>
<text x="895" y="370" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">4</text>
<circle cx="895" cy="392" r="10" fill="#b91c1c"/>
<text x="895" y="396" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">5</text>
<text x="912" y="396" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">the first probe reported a healthy camera as dead</text>
<path d="M1110 345 C 1140 345 1140 234 972 216" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/>
<text x="1000" y="440" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="italic">Ping proves the arm's network stack. It says nothing about the camera behind it.</text>
<text x="24" y="540" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Fix order is the layer order: hand-over, modules, device, identity, delivery, openers, rate. Then QoS on the subscriber side.</text>
