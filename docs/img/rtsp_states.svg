<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs>
<rect width="1080" height="440" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Asking RTSP itself: OPTIONS, then DESCRIBE, over TCP on port 554</text>
<text x="24" y="54" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Five outcomes that ping, HTTP 200 and kinova_vision's own log cannot tell apart.</text>
<rect x="24" y="110" width="130" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="89" y="134" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">TCP connect</text>
<text x="89" y="152" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">IP:554, 6 s</text>
<line x1="156" y1="137" x2="232" y2="137" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrb)"/>
<rect x="234" y="110" width="130" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="299" y="134" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">OPTIONS</text>
<text x="299" y="152" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">expect 200 OK</text>
<line x1="366" y1="137" x2="442" y2="137" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrb)"/>
<rect x="444" y="110" width="130" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="509" y="134" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">DESCRIBE</text>
<text x="509" y="152" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">expect an SDP</text>
<line x1="576" y1="137" x2="652" y2="137" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrb)"/>
<rect x="654" y="110" width="150" height="54" rx="6" fill="#ecfdf5" stroke="#15803d" stroke-width="1.2"/>
<text x="729" y="134" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">SERVING</text>
<text x="729" y="152" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">m=video, a=framerate:N</text>
<line x1="89" y1="166" x2="89" y2="218" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3 3"/>
<rect x="11" y="220" width="156" height="64" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="89" y="242" font-size="11.5" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">no TCP connection</text>
<text x="89" y="258" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">wrong IP, arm off, or port</text>
<text x="89" y="270" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">closed</text>
<line x1="299" y1="166" x2="299" y2="218" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3 3"/>
<rect x="221" y="220" width="156" height="64" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="299" y="242" font-size="11.5" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">connected, no reply</text>
<text x="299" y="258" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">the vision module is</text>
<text x="299" y="270" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">WEDGED; power-cycle the</text>
<line x1="509" y1="166" x2="509" y2="218" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3 3"/>
<rect x="431" y="220" width="156" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="509" y="242" font-size="11.5" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">OPTIONS ok, DESCRIBE silent</text>
<text x="509" y="258" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">server up, camera behind</text>
<text x="509" y="270" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">it not</text>
<line x1="729" y1="166" x2="729" y2="218" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3 3"/>
<rect x="651" y="220" width="156" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="729" y="242" font-size="11.5" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">SDP without m=video</text>
<text x="729" y="258" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">wrong path or no video</text>
<text x="729" y="270" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">track</text>
<rect x="24" y="320" width="1032" height="92" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="40" y="344" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">What does NOT tell you the camera works</text>
<text x="40" y="364" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">ping IP            proves the arm's network stack only. Both arms answered ping while one RTSP server was wedged.</text>
<text x="40" y="379" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">HTTP 200 in 86 ms  same: the web server is not the vision module.</text>
<text x="40" y="394" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">gst-launch rtspsrc ! fakesink   can never reach PLAYING (rtspsrc has dynamic pads). It reported a healthy camera as broken and blocked it.</text>
<text x="40" y="408" font-size="10" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"></text>
<text x="24" y="428" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="italic">A check that cannot pass is worse than no check. Prove a new probe against a known-good device before trusting a negative.</text>
</svg>