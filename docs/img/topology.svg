<text x="775" y="338" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">arm (Kinova Gen3)</text>
<text x="775" y="356" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">vision module, RTSP :554</text>
